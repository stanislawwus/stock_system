# Event classification and fact extraction (src/nlp/events.py, src/nlp/facts.py). Decisions: D-39.

events:
  # Multi-label over the D-10 taxonomy; 'none' is predicted when no label fires. 8-K item 9.01
  # (financial statements and exhibits) is attached to almost every 8-K and says nothing about
  # the event, so it is dropped everywhere; other items outside the taxonomy map to other_item.
  labels: ["1.01", "2.01", "2.02", "2.05", "3.02", "5.02", "5.07", "7.01", "8.01", other_item]
  drop_items: ["9.01"]
  # (a) rules: union of the item codes of the tagged ticker's 8-Ks accepted within this window
  # of the headline (the same +/- 24 h used to stratify news_100, config/data_quality.yaml).
  # The derived label is available at max(headline, filing acceptance) (D-16, D-24).
  window_hours_before: 24
  window_hours_after: 24
  # (b) TF-IDF + one-vs-rest logistic regression on headlines, trained on the train split only
  # with the rule labels as weak targets (R3). Fixed a priori, not tuned on the gold set.
  train_relevant_only: true        # headline must name the tagged company (src/nlp/relevance.py)
  tfidf:
    ngram_max: 2
    min_df: 3
    max_features: 50000
    sublinear_tf: true
  logreg:
    C: 1.0
    class_weight: balanced         # weak positives are rare (most headlines are 'none')
    max_iter: 2000
  threshold: 0.5                   # P(label) above which a label is predicted

facts:
  # EX-99.1 press release -> {metric, value, unit, period} with a grounding span (D-39).
  snippet_chars: 4000            # the headline numbers sit at the top of the release
  regex_context_chars: 40        # look-behind for "adjusted" / "non-GAAP" before a regex match
  value_rel_tol: 0.01            # eval: within +/- 1 % of XBRL (docs/03_eval_plan.md)
  gold_n_filings: 30             # 8-K item 2.02 filings of dev splits, one per ticker first
  llm_n_filings: 15              # first 15 of the 30 go to the LLM (2 batched calls)
  gold_max_days_after_period: 100  # XBRL quarter must end at most this long before the 8-K
  sample_seed: 20261114
