# Collector settings (AGENTS.md R14, R15). Periods come from config/splits.yaml (frozen).
# Raw responses are cached under raw_dir/<source>/<period>/... so dev and test stay apart (D-13).

raw_dir: data/raw

prices:                         # daily bars; available_at = 16:00 ET bar close (D-24)
  providers: [yfinance, stooq]  # tried in order per ticker; stooq only for tickers yfinance missed
  yfinance_batch: 25            # tickers per yfinance download call
  outlier_move_pct: 0.20        # |close/prev_close - 1| above this is flagged by the quality check
  min_completeness: 0.99        # share of exchange sessions present per ticker (target, D-29)

finnhub:                        # company news; available_at = provider datetime (D-24)
  base_url: https://finnhub.io/api/v1
  calls_per_minute: 55          # documented limit 60/min; margin for clock skew
  free_history_days: 365        # free plan serves about one year back from today
  initial_window_days: 31
  truncation_threshold: 200     # a response this long may be cut (cap ~250): split the window
  max_retries: 4
  retry_backoff_seconds: 5

edgar:                          # filings; available_at = acceptanceDateTime (UTC, verified D-29)
  requests_per_second: 8        # SEC fair-access limit is 10/s; User-Agent from SEC_USER_AGENT
  forms: ["8-K", "10-Q", "10-K", "4"]
  text_forms: ["8-K"]           # fetch exhibit/primary-document text for these
  exhibit_types: ["EX-99.1", "EX-99"]   # press release; else the primary document is used
  max_text_chars: 300000
  max_retries: 4
  retry_backoff_seconds: 2

xbrl:                           # companyfacts; available_at = acceptance of the carrying filing (D-30)
  forms: ["10-Q", "10-K"]
  concepts:                     # first concept present wins, per filing and period
    revenue:
      - Revenues
      - RevenueFromContractWithCustomerExcludingAssessedTax
      - SalesRevenueNet
      - RevenuesNetOfInterestExpense
    eps_diluted: [EarningsPerShareDiluted]
    net_income: [NetIncomeLoss]
  quarter_days: [80, 100]       # duration window that counts as a quarter
  annual_days: [350, 380]       # ... and as a fiscal year (10-K)
  # a fact whose accession is not among the collected filings gets this conservative time:
  # the EDGAR filing window closes at 22:00 ET, so acceptance <= filed date 22:00 ET.
  fallback_local_time: "22:00"
