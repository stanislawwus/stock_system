# Data-quality and text-cleaning settings (AGENTS.md R14). Used by src/nlp/clean.py and
# src/eda/quality.py; findings in docs/04_data_quality.md.

headline:
  min_chars: 15            # shorter strings are fragments ("Form 8.3", "14. OURA"): not classifiable
  max_chars: 250           # p99 of Finnhub headlines is ~170; longer ones are pasted bodies
  listicle_pattern: '^\d{1,3}\.\s'   # "14. OURA": a list item, not a headline

language:
  min_latin_share: 0.9     # share of letters in Latin script; below it the text is flagged non-English
  foreign_min_hits: 2      # distinct foreign function words needed (Latin-script languages)

tickers:
  roundup_min_tickers: 5   # one article tagged with this many tickers or more is a roundup/list piece

dedup:
  window_hours: 24         # same normalised headline for one ticker within this window = syndicated copy

filing_text:
  header_max_lines: 4      # an "Item x.xx" heading wraps over at most this many lines
