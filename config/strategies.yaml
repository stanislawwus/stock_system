# Parameters of every strategy. Tuned on `train` only; `validation` picks aggregator weights.
# Values here are starting points taken from common practice, not fitted yet.
buy_and_hold:
  horizon_days: null                 # null = hold to the end of the split (no time exit)
momentum:                            # simplified 12-1 (D-35): close[t-21] / close[t-252] - 1
  lookback_days: 252                 # ~12 months of trading days
  skip_days: 21                      # skip the last month (short-term reversal)
  score_scale: 0.5                   # score = clip(r_12_1 / score_scale, -1, 1)
  horizon_days: 20                   # exit at the close of D+h (monthly holding)
mean_reversion:                      # short-term reversal on a volatility-scaled k-day return (D-35)
  lookback_days: 5                   # k: the move being faded
  vol_window: 60                     # daily-return stdev window for the z-score
  entry_z: 1.0                       # long only when z <= -entry_z
  z_scale: 2.0                       # score = clip((-z - entry_z) / z_scale, -1, 1)
  horizon_days: 5
finbert_v0:                          # walking-skeleton news strategy (D-36)
  method: finbert                    # sentiment.method rows to average (finbert | lexicon)
  min_articles: 1                    # fewer relevant, deduplicated, scored items -> cash
  horizon_days: 1                    # exit at the close of D+1 (the drift_ar horizon, D-28)
news_sentiment:
  baseline_window_days: 20
  min_articles_per_day: 1
event:                               # 8-K item strategy (D-40); item drift table learned on train
  item_table_universe: universe      # fit the per-item mean drift_ar on all universe names (train)
  min_label_n: 10                    # an item with fewer train events carries no weight
  score_scale: 0.01                  # mean drift_ar of 1 % -> score 1
impact:                              # impact model + calibration (D-40); fit on train, calibrate on val_a
  model_dir: data/models
  feature_dir: data/features
  vol_window: 20                     # daily-return stdev window (sessions)
  growth_tolerance_days: 20          # YoY match: prior period ends 365 +/- this many days earlier
  growth_clip: 1.0                   # growth_momentum clipped to [-clip, clip]
  logreg: {C: 1.0, max_iter: 2000}
  hgb: {max_depth: 3, learning_rate: 0.05, max_iter: 150, min_samples_leaf: 40, l2_regularization: 1.0}
  calibrator: platt                  # platt | isotonic; Platt fixed a priori (val_a has ~300 rows)
  val_fit_fraction: 0.5              # first half of validation sessions = val_a (fit), rest = val_b (report)
  ece_bins: 10
aggregate_equal:                     # equal weights of sentiment, event and impact scores (D-40)
  components: [sentiment, event, impact]
selection:                           # hold period x entry threshold grid, Sharpe after costs (D-40)
  hold_days: [1, 3, 5, 10]           # hold exactly h sessions (min holding period = time exit)
  entry_threshold: [0.0, 0.05, 0.1, 0.2, 0.3]   # on the score; impact: score = 2p - 1
  min_trades: 10                     # fewer round trips -> not eligible (too few to judge)
  period:                            # where each strategy's hold/threshold is chosen (R3)
    event: train
    impact: val_a
    aggregate_equal: val_a
contrarian:                          # Should
  move_sigma: 2.0
  lookback_days: 60
insider:                             # Should
  min_open_market_buyers: 2
  window_days: 30
smc:                                 # Should, crypto only
  swing_length: 10
  equal_level_tolerance_pct: 0.1
  choch_within_candles: 12
  min_risk_reward: 2.0
aggregator:
  method: hedge                      # hedge | stacking | llm_researcher | equal
  hedge_eta: 0.1
  lookback_days: 20
  confidence_threshold: null         # filled from the validation run, see config/risk.yaml

arena:                               # make arena (D-42): validation only, never the test period
  strategies: [buy_and_hold, momentum, mean_reversion, finbert_v0, event, impact, aggregate_equal]
  headline: aggregate_equal          # the strategy whose deflated Sharpe is the arena metric
  ablation_of: aggregate_equal       # drop-one ablation over its `components`
  random_controls:
    n: 1000                          # matched random strategies per non-benchmark strategy
    seed: 20261114
    modes: [names, timing_and_names]   # names = same entry days, random tickers (strict match)
  dsr_target: 0.95                   # deflated Sharpe = P(true Sharpe > best-of-N luck)
  trials_log: evals/trials.csv       # every configuration ever tried; N of the deflated Sharpe

backtest:                            # src/sim (D-35); costs and the position cap are in config/risk.yaml
  universe: watchlist                # watchlist | universe
  bootstrap:
    n_resamples: 2000
    block_days: 5                    # moving-block bootstrap keeps short autocorrelation
    ci: 0.95
    seed: 20261114
  trading_days_per_year: 252
  risk_managed: [event, impact, aggregate_equal]   # src/sim/risk.py applied to these (D-40)
