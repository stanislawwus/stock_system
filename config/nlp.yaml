  # Phrases that contain an alias but do not name the company; removed (case-insensitive) before
  # matching, so another mention in the same text still counts. The JPM-hosted healthcare
  # conference is named in every presenting company's PR (docs/evals.md relevance).
  exclude_phrases:
    JPM: [J.P. Morgan Healthcare Conference, J.P. Morgan Health Care Conference,
          JPMorgan Healthcare Conference, JP Morgan Healthcare Conference]

dedup:
  # Near-duplicate = MinHash estimate of the Jaccard similarity of character shingles of the
  # normalised headline >= threshold, within window_hours of an earlier kept item of the same
  # ticker. The earliest copy is kept, so the decision only depends on earlier items (causal).
  shingle_chars: 4
  num_perm: 128
  threshold: 0.6
  window_hours: 24
  seed: 20261114

sentiment:
  finbert_model: ProsusAI/finbert
  finbert_revision: 0bc2ac10dda6929bcb1f77ccc43c7ec5c424f031   # pinned HF commit
  batch_size: 64
  max_tokens: 64             # headlines; longer text is truncated by the tokenizer
  max_chars: 2000            # untrusted text is truncated before it reaches a model (R6)
  news_text: headline        # headline | headline_summary
  backend: auto              # auto (finbert if installed, else lexicon) | finbert | lexicon

features:
  # make features: which tickers get sentiment rows (watchlist keeps a CPU run under ~15 min)
  universe: watchlist        # watchlist | universe
  lookback_days_before_split: 7   # news before the first split day still feeds its first signal

features_test:
  # make features-test (D-38): FinBERT inference on test-period news, written to parquet, not
  # DuckDB (no competition for the single writer, R7). The final run reads it via MarketView.
  backend: finbert           # no lexicon fallback: the final run must see the dev-time model
  scores_path: data/test_scores.parquet
  parts_dir: data/test_scores.parts     # one parquet part per chunk = resumable checkpoint
  chunk_articles: 1024       # articles per checkpoint (~1 min on a 14-thread CPU)

# Fallback lexicon (D-09, D-36): a compact list of finance cue words in the spirit of
# Loughran-McDonald, not the full LM dictionary. Exact match on lower-cased words.
lexicon:
  positive: [beat, beats, upgrade, upgrades, upgraded, outperform, surge, surges, soar, soars,
             jump, jumps, rally, rallies, gain, gains, record, raise, raises, raised, boost,
             boosts, strong, stronger, growth, profit, profitable, buyback, approval, approved,
             wins, bullish, tops, exceed, exceeds, exceeded, rebound, rebounds, upbeat,
             higher, climbs, climb, rises, rise, accelerate, accelerates, breakthrough, expand,
             expands, dividend, overweight, buy]
  negative: [miss, misses, missed, downgrade, downgrades, downgraded, underperform, plunge,
             plunges, slump, slumps, fall, falls, drop, drops, sink, sinks, tumble, tumbles,
             loss, losses, cut, cuts, weak, weaker, lawsuit, sue, sues, probe, investigation,
             recall, recalls, layoff, layoffs, bearish, warn, warns, warning, decline, declines,
             lower, lowers, slash, slashes, crash, fraud, fined, penalty, delay, delays,
             halt, halts, bankruptcy, default, risk, risks, concern, concerns, sell, underweight,
             verdict, strike, slowdown, shortfall]
