# NLP layer settings (src/nlp). No magic numbers in code (AGENTS.md R14). Decisions: D-36.

relevance:
  # A news item is relevant to its tagged ticker when the ticker symbol or a company alias appears
  # in the headline or summary. Aliases match case-insensitively on word boundaries.
  # Bare symbols match case-sensitively; symbols that are also English words or very short need a
  # marker: "$T", "(T)", "NYSE: T", "NASDAQ: T".
  min_bare_symbol_len: 3
  ambiguous_symbols: [LOW, CAT, COST, HD, NOW, ALL, KO, PM, MO, SO, DE, GE, MA, MS, T, C, V, BA,
                      DIS, LIN, AMT, UNP, MMM, ABT, CVS, PEP, LLY, BLK, TMO]
  aliases:
    AAPL: [Apple, iPhone]
    MSFT: [Microsoft, Azure]
    NVDA: [Nvidia]
    AVGO: [Broadcom]
    ORCL: [Oracle]
    ADBE: [Adobe]
    CRM: [Salesforce]
    CSCO: [Cisco]
    INTC: [Intel]
    AMD: [Advanced Micro Devices, AMD]
    QCOM: [Qualcomm]
    TXN: [Texas Instruments]
    IBM: [IBM]
    ACN: [Accenture]
    INTU: [Intuit, TurboTax]
    GOOGL: [Alphabet, Google, YouTube]
    META: [Meta Platforms, Facebook, Instagram, WhatsApp]
    NFLX: [Netflix]
    DIS: [Disney]
    CMCSA: [Comcast, NBCUniversal]
    VZ: [Verizon]
    T: [AT&T]
    TMUS: [T-Mobile]
    AMZN: [Amazon]
    TSLA: [Tesla]
    HD: [Home Depot]
