[project]
name = "stock-awareness-assistant"
version = "0.1.0"
description = "News + SEC filings -> sentiment/events -> impact -> strategy arena -> simulator -> chat with citations (NLP Assignment 1)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "python-dotenv>=1.0",
  "tzdata>=2024.1",
  "duckdb>=1.0",
  "pandas>=2.2",
  "numpy>=1.26",
  "pyarrow>=16.0",
  "httpx>=0.27",
  "yfinance>=0.2.40",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "streamlit>=1.35",
]

[project.optional-dependencies]
# Heavy extras are opt-in (AGENTS.md R14): `uv sync --extra finbert`
finbert = ["torch>=2.2", "transformers>=4.40"]

[dependency-groups]
dev = [
  "matplotlib>=3.11.2",
  "pytest>=8.2",
  "ruff>=0.5",
]

[tool.uv]
# Not an installable package: the import root is `src` and Makefile exports PYTHONPATH=. (decisions D-02)
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data", "docs", ".venv"]

[tool.ruff.lint]
# DTZ: naive datetimes are a time-leak risk (AGENTS.md R2). B: bugbear. UP: modern syntax. I: imports.
select = ["E", "F", "I", "B", "UP", "DTZ"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Query", "fastapi.Depends", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ"]
"src/eda/quality.py" = ["E501"]  # generated-document templates have long table rows
"src/eda/run.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q -ra"
